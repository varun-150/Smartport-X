name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # CI test credential injected from a repository secret; the literal is a
          # throwaway fallback for pull requests where secrets are unavailable.
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}
          POSTGRES_DB: smartportx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Init databases (schemas per service)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          chmod +x scripts/init-databases.sh
          POSTGRES_USER=postgres POSTGRES_DB=smartportx PGHOST=127.0.0.1 PGPASSWORD="${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}" ./scripts/init-databases.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml

  dashboard:
    name: Dashboard lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: smartportx-dashboard/package-lock.json
      - name: Install
        working-directory: smartportx-dashboard
        run: npm ci
      - name: Lint
        working-directory: smartportx-dashboard
        run: npm run lint
      - name: Test
        working-directory: smartportx-dashboard
        run: npm test
      - name: Build
        working-directory: smartportx-dashboard
        run: npm run build

  dependency-scan:
    name: Backend SCA (OWASP Dependency-Check)
    # SCA needs authenticated NVD access to be reliable. Run on trusted pushes only
    # and skip gracefully when the NVD_API_KEY repository secret is not configured.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run OWASP Dependency-Check (opt-in profile 'sca')
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is not configured; skipping SCA. Set the CI secret to enable it."
            exit 0
          fi
          mvn -B -ntp -Psca -DskipTests -DnvdApiKeyEnvironmentVariable=NVD_API_KEY dependency-check:check
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sca-report
          path: '**/target/dependency-check-report.*'

  security-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Gitleaks needs the base and head commits available to scan pull-request diffs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
