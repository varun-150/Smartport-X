# Private network listener. The dashboard is an edge SPA served on :3000 inside the
# compose network; nothing here is exposed beyond that listener.
server {
    listen       3000;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # REST API -> Spring Cloud Gateway (no StripPrefix: gateway routes already expect
    # the full /api/v1/** path).
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    # STOMP over SockJS -> gateway /ws/** route (lb:ws://smartportx-notification).
    location /ws/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: unknown paths -> index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}