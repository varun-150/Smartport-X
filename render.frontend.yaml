# SmartPort-X frontend Blueprint.
# In Render, create a Blueprint and set Blueprint Path to render.frontend.yaml.
services:
  - type: web
    name: smartportx-frontend
    runtime: static
    rootDir: smartportx-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      # Set this to the public Render Gateway URL, ending in /api.
      # Example: https://smartportx-gateway.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
