server:
  port: 8083

spring:
  application:
    name: smartportx-gate
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartportx?currentSchema=smartportx_gate}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}

smartportx:
  monitoring:
    allowed-networks: ${SMARTPORTX_MONITORING_ALLOWED_NETWORKS:127.0.0.1/32,::1/128,172.16.0.0/12}
  gate:
    source: smartportx-gate
    operating-hours-start: "06:00"
    operating-hours-end: "22:00"
    window-minutes: 15
    grace-minutes: 120
    max-book-ahead-days: 14
    min-lead-hours: 2
    default-window-capacity: 25
    assignment-grace-minutes: 90
    swing-weight-kg: 2500
    booking-estimate-fee: 50000
    average-wait-minutes: 15
    active-lanes: GATE-01,GATE-02
    maintenance-lanes: GATE-03
  events:
    publish-to-rabbitmq: ${EVENTS_PUBLISH_TO_RABBITMQ:false}
    exchange: ${EVENTS_EXCHANGE:smartportx.domain-events}
  clients:
    container:
      base-url: ${CONTAINER_BASE_URL:http://localhost:8084}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    yard:
      base-url: ${YARD_BASE_URL:http://localhost:8082}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    integration:
      base-url: ${INTEGRATION_BASE_URL:http://localhost:8086}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 100ms,250ms,500ms,1s
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    rabbit:
      enabled: ${EVENTS_PUBLISH_TO_RABBITMQ:false}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      produce: w3c,b3
      consume: w3c,b3
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
