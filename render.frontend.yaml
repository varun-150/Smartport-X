# SmartPort-X frontend Blueprint.
# In Render, create a Blueprint and set Blueprint Path to render.frontend.yaml.
# Nginx serves the SPA and proxies /api + /ws to the private-network Gateway.
services:
  - type: web
    name: smartportx-frontend
    runtime: docker
    rootDir: smartportx-dashboard
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /
    plan: free
    autoDeployTrigger: checksPass
