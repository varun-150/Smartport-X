name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartportx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Init databases (schemas per service)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          chmod +x scripts/init-databases.sh
          POSTGRES_USER=postgres POSTGRES_DB=smartportx PGHOST=127.0.0.1 PGPASSWORD=postgres ./scripts/init-databases.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml

  dashboard:
    name: Dashboard lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: smartportx-dashboard/package-lock.json
      - name: Install
        working-directory: smartportx-dashboard
        run: npm ci
      - name: Lint
        working-directory: smartportx-dashboard
        run: npm run lint
      - name: Test
        working-directory: smartportx-dashboard
        run: npm test
      - name: Build
        working-directory: smartportx-dashboard
        run: npm run build

  security-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}