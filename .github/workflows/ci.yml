name: CI

concurrency:
  group: smartportx-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartportx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Init databases (schemas per service)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          chmod +x scripts/init-databases.sh
          POSTGRES_USER=postgres POSTGRES_DB=smartportx PGHOST=127.0.0.1 PGPASSWORD=postgres ./scripts/init-databases.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml

  dashboard:
    name: Dashboard lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: smartportx-dashboard/package-lock.json
      - name: Install
        working-directory: smartportx-dashboard
        run: npm ci
      - name: Lint
        working-directory: smartportx-dashboard
        run: npm run lint
      - name: Test
        working-directory: smartportx-dashboard
        run: npm test
      - name: Build
        working-directory: smartportx-dashboard
        run: npm run build

  docker-validation:
    name: Docker Compose config & image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all Compose images
        run: docker compose --parallel 1 build
      - name: Start stack and verify service health
        run: |
          docker compose up -d
          healthy=0
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8081/actuator/health >/dev/null \
              && curl -fsS http://localhost:8082/actuator/health >/dev/null \
              && curl -fsS http://localhost:8083/actuator/health >/dev/null \
              && curl -fsS http://localhost:8084/actuator/health >/dev/null \
              && curl -fsS http://localhost:8085/actuator/health >/dev/null \
              && curl -fsS http://localhost:8086/actuator/health >/dev/null \
              && curl -fsS http://localhost:8087/actuator/health >/dev/null \
              && curl -fsS http://localhost:8080/actuator/health >/dev/null \
              && curl -fsS http://localhost:3000 >/dev/null; then
              healthy=1
              break
            fi
            sleep 10
          done
          test "$healthy" -eq 1
      - name: Verify RabbitMQ application user and notification queue
        run: |
          docker compose exec -T rabbitmq rabbitmqctl list_users | grep -q 'smartportx_app'
          docker compose exec -T rabbitmq rabbitmqctl list_queues name | grep -q 'notification.domain-events'
          docker compose exec -T rabbitmq rabbitmqctl list_queues name | grep -q 'notification.domain-events.dlq'
      - name: Verify rejected event reaches Notification DLQ
        run: |
          docker compose exec -T rabbitmq rabbitmqadmin -u smartportx_admin -p smartportx_admin_local_change_me publish exchange=smartportx.domain-events routing_key=container.ContainerRegistered payload='not-json'
          dead_lettered=0
          for attempt in {1..15}; do
            count=$(docker compose exec -T rabbitmq rabbitmqctl list_queues name messages_ready | awk '$1 == "notification.domain-events.dlq" { print $2 }')
            if [ "${count:-0}" -ge 1 ]; then
              dead_lettered=1
              break
            fi
            sleep 2
          done
          if [ "$dead_lettered" -ne 1 ]; then
            echo "Notification queue consumers:"
            docker compose exec -T rabbitmq rabbitmqctl list_consumers
            echo "RabbitMQ queue arguments and counters:"
            docker compose exec -T rabbitmq rabbitmqctl list_queues name messages_ready messages_unacknowledged arguments
            echo "RabbitMQ bindings:"
            docker compose exec -T rabbitmq rabbitmqctl list_bindings source_name destination_name routing_key
            echo "Notification service logs:"
            docker compose logs --no-color --tail=200 notification
            exit 1
          fi
      - name: Stop test stack
        if: always()
        run: docker compose down -v

  security-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Gitleaks needs the base and head commits available to scan pull-request diffs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
