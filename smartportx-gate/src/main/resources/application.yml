server:
  port: 8083

spring:
  application:
    name: smartportx-gate
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartportx?currentSchema=smartportx_gate}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}

smartportx:
  gate:
    source: smartportx-gate
    operating-hours-start: "06:00"
    operating-hours-end: "22:00"
    window-minutes: 15
    grace-minutes: 120
    max-book-ahead-days: 14
    min-lead-hours: 2
    default-window-capacity: 25
    assignment-grace-minutes: 90
    swing-weight-kg: 2500
    booking-estimate-fee: 50000
    average-wait-minutes: 15
    active-lanes: GATE-01,GATE-02
    maintenance-lanes: GATE-03
  events:
    publish-to-rabbitmq: ${EVENTS_PUBLISH_TO_RABBITMQ:false}
    exchange: ${EVENTS_EXCHANGE:smartportx.domain-events}
  clients:
    container:
      base-url: ${CONTAINER_BASE_URL:http://localhost:8084}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    yard:
      base-url: ${YARD_BASE_URL:http://localhost:8082}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    integration:
      base-url: ${INTEGRATION_BASE_URL:http://localhost:8086}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics