# SmartPortX — Prometheus scrape config (M1.5)
# Scrape targets use docker-compose service names inside smartportx-network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: smartportx-eureka
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka:8761"]

  - job_name: smartportx-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: smartportx-identity
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity:8081"]

  - job_name: smartportx-yard
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["yard:8082"]

  - job_name: smartportx-gate
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gate:8083"]

  - job_name: smartportx-container
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["container:8084"]

  - job_name: smartportx-vessel
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vessel:8085"]

  - job_name: smartportx-integration
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["integration:8086"]

  - job_name: smartportx-notification
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification:8087"]