server:
  port: 8085

spring:
  application:
    name: vessel
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartportx?currentSchema=smartportx_vessel}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}

smartportx:
  vessel:
    source: smartportx-vessel
    moves-per-hour: 25
    verify-containers-at-planning: true
  events:
    publish-to-rabbitmq: ${EVENTS_PUBLISH_TO_RABBITMQ:false}
    exchange: ${EVENTS_EXCHANGE:smartportx.domain-events}
  clients:
    container:
      base-url: ${CONTAINER_BASE_URL:http://localhost:8084}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    yard:
      base-url: ${YARD_BASE_URL:http://localhost:8082}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics