spring:
  datasource:
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:5432/smartportx?currentSchema=smartportx_identity
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  main:
    allow-bean-definition-overriding: true

eureka:
  client:
    enabled: false

smartportx:
  security:
    bcrypt-strength: 4
    login-rate-limit: 5
    seed-demo-users: false