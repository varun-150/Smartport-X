server:
  port: 8081

spring:
  application:
    name: smartportx-identity
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartportx?currentSchema=smartportx_identity}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

smartportx:
  monitoring:
    allowed-networks: ${SMARTPORTX_MONITORING_ALLOWED_NETWORKS:127.0.0.1/32,::1/128,172.16.0.0/12}
  security:
    # X-Forwarded-For is honoured only when the TCP peer is one of these networks
    # (the Docker bridge where the gateway runs). Direct clients cannot spoof it.
    trusted-proxy-networks: ${SMARTPORTX_TRUSTED_PROXY_NETWORKS:172.16.0.0/12}
    jwt:
      issuer: smartportx-identity
      access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
      key-size: ${JWT_KEY_SIZE:2048}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    login-rate-limit: ${LOGIN_RATE_LIMIT:5}
    seed-demo-users: ${SEED_DEMO_USERS:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 100ms,250ms,500ms,1s
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      produce: w3c,b3
      consume: w3c,b3
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
