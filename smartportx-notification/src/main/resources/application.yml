server:
  port: 8087

spring:
  application:
    name: smartportx-notification
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartportx?currentSchema=smartportx_notification}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}

smartportx:
  events:
    consume-from-rabbitmq: ${EVENTS_CONSUME_FROM_RABBITMQ:false}
    exchange: ${EVENTS_EXCHANGE:smartportx.domain-events}
    queue: ${EVENTS_QUEUE:notification.domain-events}
    source: smartportx-notification
  notification:
    alert:
      dedupe-window-seconds: ${ALERT_DEDUPE_WINDOW_SECONDS:300}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics