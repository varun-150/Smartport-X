eureka:
  client:
    enabled: false

management:
  tracing:
    enabled: false

spring:
  main:
    allow-bean-definition-overriding: true

smartportx:
  gateway:
    authorization:
      public-routes:
        - /api/v1/auth/login
        - /api/v1/auth/refresh
        - /api/v1/auth/jwks
        - /actuator/health
        - /actuator/info
      role-routes:
        - path: /api/v1/yard
          roles: [ADMIN, TERMINAL_OP, YARD_MANAGER, READONLY]
        - path: /api/v1/gate
          roles: [ADMIN, TERMINAL_OP, GATE_OPERATOR, READONLY]
        - path: /api/v1/appointments
          roles: [ADMIN, TERMINAL_OP, GATE_OPERATOR, READONLY]
        - path: /api/v1/quotas
          roles: [ADMIN, TERMINAL_OP, GATE_OPERATOR, READONLY]
        - path: /api/v1/containers
          roles: [ADMIN, TERMINAL_OP]
        - path: /api/v1/vessels
          roles: [ADMIN, TERMINAL_OP, READONLY]
        - path: /api/v1/schedules
          roles: [ADMIN, TERMINAL_OP, READONLY]
        - path: /api/v1/discharge-plans
          roles: [ADMIN, TERMINAL_OP, READONLY]
        - path: /api/v1/integration
          roles: [ADMIN]
        - path: /api/v1/notifications
          roles: [ADMIN, TERMINAL_OP, YARD_MANAGER, GATE_OPERATOR, READONLY]
        - path: /api/v1/users
          roles: [ADMIN]
    rate-limit:
      capacity: 100
      refill-per-minute: 60